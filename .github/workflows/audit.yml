name: Content Audit

# DB-derived audits need a database WITH the real content. GitHub runners have
# no reachable content DB (prod mongo is deliberately unexposed), which is why
# the old in-runner version failed for months with MongoParseError on an empty
# MONGO_URI. Ground truth lives on prod — so run the audits there, inside the
# api container, over SSH (same PROD_* secrets prod-deploy.yml already uses).
on:
  push:
    branches: [main]
    paths:
      - 'ai-learning-backend/backend/config/seed*.js'
      - 'ai-learning-backend/backend/config/audit*.mjs'
  workflow_dispatch: # allow manual runs

jobs:
  audit:
    name: Coverage & Math Audit (on prod)
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          [ -n "${{ secrets.PROD_SSH_KEY }}" ] || { echo "::error::PROD_SSH_KEY secret is empty/unset"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run content audits inside the prod api container
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          run() { echo "=== $* ==="; docker exec ailearningpath-api-1 "$@"; }
          run node config/auditCoverage.mjs
          run node config/auditMathChecklist.mjs --board=CBSE --grade=10
          run node config/auditMathChecklist.mjs --board=CBSE --grade=9
          run node config/auditMathChecklist.mjs --board=ICSE --grade=10
          run node config/validateBoardIsolation.mjs
          run node config/auditSysdTrack.mjs
          run node config/auditSysdDepth.mjs
          run node config/auditLldTrack.mjs
          EOF
